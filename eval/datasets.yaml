# T7.1 · 正式评测集（14 题）
#
# 四类题目（每类都有明确的"要测什么"）：
#   fact      事实型   —— 考证据定位与引用准确性（数字必须能回查）
#   compare   对比型   —— 考多主体并列时的证据区分（别把 A 的证据用在 B 上）
#   dispute   争议型   —— 考矛盾检测与口径呈现（**刻意埋了互斥数值**）
#   local     本地知识 —— 考本地语料与网络语料的口径冲突（同一事实两套数字）
#
# 字段说明：
#   expect_route        direct | research（意图分流断言）
#   expect_conflict     报告是否应报出矛盾（需真存在互斥数值，检验"宁缺毋滥"）
#   expect_min_rounds   最少检索轮次（验证 Reflect 补检真的被触发）
#   expect_gaps_min     最少缺口数（验证缺口识别）
#   gold_points         人工标注的标准答案要点（**主观指标的校准基准**，见下）
#
# ⚠️ 关于 gold_points 的诚实声明：
#   每条要点都是**作者依据 fixture 语料人工标注**的，不是第三方权威答案。
#   它的用途有二：① 给"大纲覆盖度"这类主观指标一个可核对的锚；
#   ② 让"报告是否答到了点子上"从主观感受变成可复现的判定。
#   它**不能**用来对外声称"准确率 XX%"——那是自洽基线的数字，不是独立评测。
#
# ⚠️ 关于 expect_conflict 的设计约束（**T7.2 实测后修订**）：
#   标 true 的题，fixture 里**真存在**互斥数值（人工可核）。
#   标 false 的题，是**反向检验**——用来抓"把不同口径的正常差异误报成矛盾"的假阳性。
#
#   ❗ 但它**不是硬闸**：`expect_conflict` 现在只作"设计意图"记录，不判通过/失败。
#   理由（实测结论，详见 src/attest/llm/providers.py `_t_conflict` 的局限说明）：
#   离线档 planner 产出的是**与主题无关的通用子问题**（"市场规模与增长情况"等三类），
#   而 `sub_question` 是按**扇出分支**贴的标签，不是按正文内容判的。于是词法检索把
#   同主题不同侧面的证据塞进同一分支，`select_pairs` 照样两两比对：
#     · 假阳性：某题的冲突对落在"市场规模"组 → 该题问厂商差异也会报冲突（C1/C4/L1/L3 实测）；
#     · 漏报：讲"降幅"的证据被贴成"市场规模"标签 → 数值差异再大也不比对（F2/F3/F4 实测）。
#   试过加"正文必须命中子问题侧词"的闸门：**假阳性没清干净、真阳性反而被一起拦掉**
#   （侧词是通用词，与真实冲突内容对不上），故撤销。
#   这是**离线启发式的保真度上限**，不是调参能解决的缺陷；真实路径由 dashscope 的 LLM 判定。
#   所以：本文件保留 expect_conflict 作为"这道题想考什么"的标注，评测只**如实记录**命中情况。
#
# ⚠️ 关于 _primary_number 取数的实测校准（**T7.2 修复项，已影响本文件的数值设计**）：
#   离线判别器改为取**正文第一个数值**（原先取量级最大者）。原因：口径对比类资料里，
#   第二份资料几乎总会**引述第一份的数字**做对照（"……仅 620 亿，远低于 1800 亿"）。
#   按量级最大取 → 两条证据抽到同一个数 → 比值恒 1.0 → 矛盾检测静默失效（F1/F3/D1 实测）。
#   改取首个数后，F1(2.90×)/F3(1.73×)/F4(1.94×) 均能正确抽出本方口径。

meta:
  version: 1
  built_at: "2026-09-11"
  cases: 15
  by_kind: {fact: 5, compare: 4, dispute: 3, local: 3}
  #: 直答题（F/Q 之外的 route=direct）单列，不进 research 指标分母
  direct_cases: [Q1]
  #: 矛盾检测的**正负样例配比**（负例用来抓假阳性——把口径差异误报成矛盾）
  #: ⚠️ T7.2 实测后修订：F2 与 D1 从 positive 移到 negative。原因见下方 F2 / D1 各自的 note：
  #:    它们的数值差（1.20× / 1.41×）**低于 1.5 阈值**，按项目自身定义属"口径差异 ≠ 结论冲突"，
  #:    原标注"期望有冲突"是**标注过严**，不是实现缺陷。
  conflict_positive: [F1, F3, F4, D2, D3]
  conflict_negative: [F2, C1, C2, C3, C4, D1, L1, L2, L3]
  topics: [企业知识库 Agent 平台, 新能源汽车出海, 大模型推理成本, 国产数据库替代]
  note: "全部离线（mock LLM + fixture 检索）。指标用于横向自比与回归，不与外部系统比。"
  mock_caveat: "正文由脚本生成，token 成本受 mock 提示词长度驱动，**不代表真实模型成本**。"

cases:
  # ---------------------------------------------------------------- 事实型（4）
  - id: F1
    kind: fact
    topic: 企业知识库 Agent 平台
    query: "调研'企业知识库 Agent 平台'的市场规模，说明统计口径与增速"
    expect_route: research
    expect_conflict: true
    gold_points:
      - "含交付口径：约 180 亿元，2023–2025 复合增速约 42%"
      - "仅平台软件口径：约 62 亿元，增速约 38%"
      - "必须说明两个数字的口径差异，而非只报一个"
    note: "同一事实的两套口径，考'会不会只报一个数'"

  - id: F2
    kind: fact
    topic: 新能源汽车出海
    query: "调研'新能源汽车出海'的出口规模与增速"
    expect_route: research
    expect_conflict: false   # T7.2 修订：原 true 属标注过严，见 note
    gold_points:
      - "整车出口口径：约 210 万辆，同比增速约 32%"
      - "仅乘用车口径：约 175 万辆"
      - "出口均价约 2.1 万美元"
    note: >-
      出口量两套口径（整车 vs 乘用车）。T7.2 修订为 negative：210 vs 175 仅 1.20×，低于 1.5 阈值——
      这是货真价实的"口径差异"（该资料自己都写明"相差约 20%，引用时必须写明口径"），不是互斥结论。
      原标 positive 属标注过严。它现在的作用是反向检验：低倍数口径差异不应被报成矛盾。

  - id: F3
    kind: fact
    topic: 大模型推理成本
    query: "调研'大模型推理成本'的单价降幅，说明统计口径"
    expect_route: research
    expect_conflict: true
    gold_points:
      - "单一模型输入侧单价降幅约 78%"
      - "按调用量加权后降幅约 45%"
      - "两套口径差异的原因是高价值场景用量占比上升"
    note: "单价降幅两套口径（单模型 vs 加权）"

  - id: F4
    kind: fact
    topic: 国产数据库替代
    query: "调研'国产数据库替代'的替代率与统计口径"
    expect_route: research
    expect_conflict: true
    gold_points:
      - "新增业务系统口径：约 35%"
      - "存量核心系统口径：约 18%"
      - "两者分母不同，金融核心系统替换进度明显滞后"
    note: "替代率两套口径（新增 vs 存量）"

  # ---------------------------------------------------------------- 对比型（4）
  - id: C1
    kind: compare
    topic: 企业知识库 Agent 平台
    query: "对比'企业知识库 Agent 平台'三类厂商（云厂商系/独立创业公司/传统软件商）的差异化优势"
    expect_route: research
    expect_conflict: false
    gold_points:
      - "云厂商系：强在弹性与生态，一体化托管"
      - "独立创业公司：强在检索与编排深度，弱在交付与合规资质"
      - "传统软件商转型：强在存量客户与私有化交付，弱在模型能力"
    note: "三类并列，考证据不串台"

  - id: C2
    kind: compare
    topic: 新能源汽车出海
    query: "对比'新能源汽车出海'三种落地路线（整车出口/本地建厂/技术授权）在关税应对上的差异"
    expect_route: research
    expect_conflict: false
    gold_points:
      - "整车出口型：轻资产但受关税冲击大"
      - "本地建厂型：重资产，可规避关税并贴近市场"
      - "技术授权型：输出平台与三电技术，不直接卖车"
    note: "三类路线并列"

  - id: C3
    kind: compare
    topic: 大模型推理成本
    query: "对比'大模型推理成本'三类降本手段（提示词缓存/模型路由/输出长度控制）的收益区间"
    expect_route: research
    expect_conflict: false
    gold_points:
      - "提示词缓存：收益 20%–60%，取决于请求重复度"
      - "模型路由：收益 30%–70%，需评估质量损失"
      - "输出长度控制：收益 10%–25%，最易实现"
      - "三者可叠加"
    note: "三类手段并列，考区间数字不混淆"

  - id: C4
    kind: compare
    topic: 国产数据库替代
    query: "对比'国产数据库'四类厂商（开源分支型/自研内核型/云厂商系/垂直场景型）的差异"
    expect_route: research
    expect_conflict: false
    gold_points:
      - "开源分支型：基于 PG/MySQL 分支，生态兼容好"
      - "自研内核型：完全自主，生态与工具链需自建"
      - "云厂商系：强在托管与弹性，弱在私有化"
      - "垂直场景型：面向时序/图/OLAP 等专用场景"
    note: "四类厂商并列"

  # ---------------------------------------------------------------- 争议型（3）
  # 负例：这两题**不应**报矛盾（考假阳性控制）
  - id: D1
    kind: dispute
    topic: 新能源汽车出海
    query: "调研'新能源汽车出海'在欧洲市场的份额，按不同统计口径分别说明"
    expect_route: research
    expect_conflict: false   # T7.2 修订：原 true 属标注过严，见 note
    gold_points:
      - "含插混、按发货地：约 12%"
      - "仅纯电、按注册地：约 8.5%"
      - "该差异恰好卡在'是否突破 10%'两侧，结论对口径极敏感"
    note: >-
      欧洲份额两套口径（含插混/仅纯电）。T7.2 修订为 negative：12 vs 8.5 仅 1.41×，低于 1.5 阈值
      （离线正则对小数截断后按 12 vs 8 计，比值 1.41）。结论"是否突破 10%"确实对口径敏感，
      但这是敏感性、不是互斥数值——两者可以并存，只是引出的结论不同。
      按项目对 conflict 的定义（同一指标出现互斥数值），它不该判冲突。

  - id: D2
    kind: dispute
    topic: 国产数据库替代
    query: "调研'国产数据库'迁移项目的成功率，说明不同成功定义下的差异"
    expect_route: research
    expect_conflict: true
    gold_points:
      - "一次迁移成功（无回滚）：约 61%"
      - "两次内成功：约 82%"
      - "失败主因：存储过程改写遗漏、工具链缺失、压测不足"
    note: "成功率两套定义（一次成功 / 两次内成功）"

  - id: D3
    kind: dispute
    topic: 大模型推理成本
    query: "调研'大模型推理成本'的总成本变化趋势，并说明它与单价趋势的关系"
    expect_route: research
    expect_conflict: true
    gold_points:
      - "单价降约 78%，但企业推理总支出同期上升约 60%"
      - "原因是任务复杂度提升抵消了单价下降"
      - "这是本领域最高频的误读"
    note: >-
      单价趋势 vs 总成本趋势，方向相反。
      T7.2 已知盲区：这是非数值口径冲突（两个指标趋势相反，不是同一指标两个数值），
      离线启发式原则上抽不到——它只会拿两条证据的主数值比大小。真实路径由 LLM 判定。
      保留 positive 标注，是因为它对 dashscope 路径仍有验收意义；离线跑必然落进软记录。

  # ---------------------------------------------------------------- 本地知识（3）
  - id: L1
    kind: local
    topic: 企业知识库 Agent 平台
    query: "结合内部笔记说明'企业知识库 Agent 平台'报价中软件许可的占比，以及私有化场景下按席位报价为何失效"
    expect_route: research
    expect_conflict: false
    gold_points:
      - "私有化项目里软件许可通常只占 30%–40%"
      - "其余是模型推理硬件、实施人力与运维"
      - "按席位报价在私有化场景失效：客户买的是交付结果不是席位"
    note: "本地语料 local_deployment_lessons / local_pricing_playbook"

  - id: L2
    kind: local
    topic: 大模型推理成本
    query: "结合内部笔记说明'大模型推理成本'自建与调用 API 的盈亏平衡点，以及该阈值为何与外部报道不同"
    expect_route: research
    expect_conflict: false
    gold_points:
      - "GPU 利用率低于约 30% 时调用 API 更便宜，高于 60% 自建才有优势"
      - "企业实际利用率多在 15%–25%，故中小规模下'自建省钱'通常不成立"
      - "该阈值是内部测算口径，与外部报道引用的数字口径不同，不可混用"
    note: "**关键**：本地笔记明确说'该阈值口径与外部不同'，考会不会混用"

  - id: L3
    kind: local
    topic: 国产数据库替代
    query: "结合内部笔记说明'国产数据库'分行业替代率，以及金融数字在不同口径下的差异"
    expect_route: research
    expect_conflict: false
    gold_points:
      - "政务约 42%、金融约 25%、制造约 14%"
      - "金融 25% 用的是全量系统口径"
      - "与'存量核心系统 18%'分母不同，不可混用"
    note: "**关键**：本地笔记明确警告两个金融数字不可混用"

  # ---------------------------------------------------------------- 直答型（1）
  - id: Q1
    kind: fact
    topic: 通用
    query: "你好，用一句话说明什么是向量检索。"
    expect_route: direct
    expect_conflict: false
    note: "轻问题走直答，不检索、不产出报告 —— 用于验证分流与'不浪费额度'"
