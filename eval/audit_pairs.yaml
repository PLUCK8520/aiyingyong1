  # ---------------- 对抗样本：**故意让规则版失效**，用来暴露判定器的短板 ----------------
  # 这三条不是"凑数"，而是本次单点验证最有价值的部分：它们说明规则版为什么**不能**直接上岗。
  - id: A1
    claim: "该市场由知识库软件、Agent 编排平台与实施服务三块构成"
    evidence: "该口径含「知识库软件 + Agent 编排平台 + 交付服务」三项，若只算平台软件本体，规模约为 62 亿元。"
    verdict: supported
    note: "对抗：同义改写（实施服务≈交付服务）→ 规则版按字面覆盖打不出 supported"
  - id: A2
    claim: "该机构测算的口径不含定制交付"
    evidence: "该机构明确表示不把定制交付与算力计入市场盘子，因此与含交付口径的 180 亿元存在约 2.9 倍差距。"
    verdict: supported
    note: "对抗：**双重否定**（'不把…计入' 等于 '不含'）→ 规则版无法识别否定，只会数词"
  - id: A3
    claim: "该市场被本报告与另一份报告的统计口径差异约为 2.9 倍"
    evidence: "因此与含交付口径的 180 亿元存在约 2.9 倍差距。"
    verdict: supported
    note: "对抗：数值以'倍'表达且主体靠指代 → 规则版只认带单位的数值，覆盖率不足"
