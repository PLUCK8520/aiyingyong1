# T3.10 · 审计判定单点验证集（20 条已知答案的 claim×证据 对）
#
# ⚠️ 诚实声明（务必连同数字一起读）：
#   本集的 claim 与 evidence 均由**作者构造**，标签也由作者人工标注。它是"自洽基线"，
#   不是独立第三方基准——真实准确率必然低于此处的数字。它的价值在于：
#     ① 把"审计器会不会误判"从猜想变成**可复现的数字**；
#     ② 给出回归基线——之后换 LLM 版审计器，用同一份集子对比，收益可量化。
#   P7 T7.1 会补 3–5 题人工标注做校准基准，届时以那份为准。
#
# evidence 字段一律取**窄片段**（模拟真实检索到的单个 chunk），不取整篇文档——
# 否则"证据里恰好也有这句话"会虚高覆盖率，掩盖判定器本身的缺陷。

meta:
  version: 2
  built_at: "2026-09-10"
  labels: {supported: 15, partial: 4, unsupported: 4}
  adversarial: [A1, A2, A3]
  measured: "规则版实测 21/23 = 91.3%；误判 A1（同义改写）、A3（指代+倍数）。A2 判对但靠词命中蒙对，非真懂否定。"

pairs:
  # ---------------- supported：关键实词覆盖 + 数值一致 ----------------
  - id: S1
    claim: "2025 年国内企业知识库与 Agent 平台市场规模约为 180 亿元人民币"
    evidence: "示例研究院测算，2025 年国内企业知识库与 Agent 平台市场规模约为 180 亿元人民币，2023–2025 年复合增速约 42%。"
    verdict: supported
    note: "数值与主体均一致"
  - id: S2
    claim: "私有化部署占比约 55%"
    evidence: "其中私有化部署占比约 55%，公有云订阅占比约 45%。"
    verdict: supported
    note: "窄片段，单点数值一致"
  - id: S3
    claim: "该口径含知识库软件、Agent 编排平台与交付服务三项"
    evidence: "报告提示：该口径含「知识库软件 + Agent 编排平台 + 交付服务」三项，若只算平台软件本体，规模约为 62 亿元。"
    verdict: supported
    note: "无关键数值，纯描述性一致"
  - id: S4
    claim: "厂商可归为云厂商系、独立 AI 创业公司与传统内容管理软件商三类"
    evidence: "可归为三类：① 云厂商系（提供托管知识库 + 模型 + 编排一体化，强在弹性与生态）；② 独立 AI 创业公司（强在检索与 Agent 编排深度，弱在交付与合规资质）；③ 传统内容管理软件商转型。"
    verdict: supported
    note: "枚举与证据完全对应"
  - id: S5
    claim: "独立 AI 创业公司强在检索与 Agent 编排深度"
    evidence: "② 独立 AI 创业公司（强在检索与 Agent 编排深度，弱在交付与合规资质）"
    verdict: supported
    note: "原话级一致"
  - id: S6
    claim: "按席位订阅每人每月 50–300 元"
    evidence: "① 按席位订阅（每人每月 50–300 元，适合内部知识问答）"
    verdict: supported
    note: "区间上限与证据一致"
