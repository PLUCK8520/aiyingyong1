    claim: "制造业进入生产环境的比例约 18%"
    evidence: "抽样 120 家企业：金融行业进入生产环境的比例约 31%，制造业约 18%，其余行业合计约 12%。"
    verdict: supported
  - id: S11
    claim: "金融与政企客户普遍要求数据不出域、检索链路可审计、模型可替换"
    evidence: "金融与政企客户普遍要求：数据不出域、检索链路可审计、模型可替换。"
    verdict: supported
