    <meta charset="UTF-8" />

    <!--
      T9.2：字体已改为**自托管**（`src/fonts.css` + `public/fonts/*.woff2`）。

      原先是 `<link>` 引 fonts.googleapis.com。2026-09-15 实测该域名与 gstatic
      的 woff2 在本机**可达**，所以**不是「加载不到」**——改自托管的真实理由是：
        ① 首屏不再依赖境外域名（即使通，也是数百 ms～数秒的不可控变量）；
        ② 离线 / 局域网演示可用（`start.bat --lan` 那条路径）；
        ③ 少两次 DNS/TLS 往返。
      故此处**刻意不再引外链**；重新生成字体见 `scripts/fetch_fonts.py`。
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
